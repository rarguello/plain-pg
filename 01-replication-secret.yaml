###############################################################################
# 01-replication-secret.yaml
# Secret con las credenciales del usuario de replicación de PostgreSQL.
#
# PostgreSQL usa un usuario dedicado con el privilegio REPLICATION
# para la streaming replication. Este usuario SOLO puede replicar,
# no puede leer ni modificar datos de las bases de datos.
#
# IMPORTANTE: Cambiar el password antes de desplegar.
###############################################################################

apiVersion: v1
kind: Secret
metadata:
  name: pg-replication-credentials
  namespace: produbanco-databases
  labels:
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  REPLICATION_USER: "replicator"
  REPLICATION_PASSWORD: "CAMBIAR_ESTE_PASSWORD_REPLICACION"
  # Password del superusuario postgres (ya debería existir en su Secret actual)
  # Si ya tienen un Secret con esto, pueden omitir esta key y referenciar el existente.
  POSTGRES_PASSWORD: "CAMBIAR_ESTE_PASSWORD_POSTGRES"
