name: release

# On a tag, publish a release with the last full-suite transcript attached, so
# the evidence travels with the version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The supported image's transcript is the one without an image in its
          # name (docs/supported-images.md); the matrix runs carry the image.
          EVIDENCE="$(find docs/evidence -name '*-full-suite.txt' \
            ! -name '*-rhel*-full-suite.txt' | sort | tail -1)"
          gh release create "$GITHUB_REF_NAME" "$EVIDENCE" \
            --title "$GITHUB_REF_NAME" \
            --notes "Full-suite evidence: \`$(basename "$EVIDENCE")\` (see docs/evidence/README.md)."
