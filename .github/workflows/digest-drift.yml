name: digest drift

# Weekly: compare the pinned postgresql-18 digest with what the registry serves
# for :latest, and open an issue when they differ. Updating the pin is a human
# decision (it means a new build of the image), so this only reports.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Compare the pin with the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHFILE: ${{ runner.temp }}/pull-secret.json
        run: |
          printf '%s' '${{ secrets.RH_PULL_SECRET }}' > "$AUTHFILE"
          CURRENT="$(./scripts/update-digest.sh | awk '/^Digest:/{print $2}')"
          # The image is pinned in one place, and the overlays only list it as a
          # component: reading the digest from an overlay finds nothing and the
          # comparison below can never pass.
          PINNED="$(grep -oE 'sha256:[0-9a-f]{64}' manifests/components/image/kustomization.yaml | head -1)"
          echo "pinned=$PINNED registry=$CURRENT"
          # An empty value means the check itself is broken, not that the pin is
          # current: fail loudly instead of reporting an issue nobody can read.
          if [ -z "$CURRENT" ] || [ -z "$PINNED" ]; then
            echo "ERROR: could not read the registry digest or the pinned digest." >&2
            exit 1
          fi
          if [ "$CURRENT" = "$PINNED" ]; then
            echo "The pin is up to date."
            exit 0
          fi
          TITLE="digest drift: the pinned postgresql-18 image is outdated"
          if gh issue list --state open --search "$TITLE" --json title --jq '.[].title' | grep -qF "$TITLE"; then
            echo "An issue is already open."
            exit 0
          fi
          BODY="The registry now serves \`$CURRENT\` for \`registry.redhat.io/rhel10/postgresql-18:latest\`, but the repo pins \`$PINNED\`.

          Update it with:

              ./scripts/update-digest.sh --apply

          Then recreate the pods (updateStrategy is OnDelete) and run the suite."
          gh issue create --title "$TITLE" --body "$BODY"
