name: scorecard

# OSSF Scorecard: supply-chain posture (pinned deps, token permissions, branch
# protection, ...). Results show up in the repo's Security tab.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF
          path: results.sarif

      - name: Upload it to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
