name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin

      - name: ShellCheck scripts and tests
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      - name: Render Kustomize overlays
        run: |
          kustomize build manifests/overlays/lab > /tmp/lab.yaml
          kustomize build manifests/overlays/lab-manual > /tmp/lab-manual.yaml

      - name: Validate scripts embedded in ConfigMaps
        run: python3 tools/check-scripts.py /tmp/lab.yaml /tmp/lab-manual.yaml
