name: ci

on:
  push:
    paths-ignore:
      - "docs/evidence/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --quiet pyyaml yamllint==1.38.0
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      - name: Render the overlays
        run: |
          for o in lab lab-manual lab-autoscale lab-metrics lab-tls lab-tls-byo lab-external; do
            kustomize build "manifests/overlays/$o" > "/tmp/$o.yaml"
          done

      - name: Embedded scripts (bash -n + shellcheck)
        run: python3 tools/check-scripts.py /tmp/lab.yaml /tmp/lab-manual.yaml

      - name: Policies (AGENTS.md hard rules)
        run: python3 tools/check-policies.py /tmp/lab.yaml /tmp/lab-manual.yaml /tmp/lab-autoscale.yaml /tmp/lab-metrics.yaml /tmp/lab-tls.yaml /tmp/lab-tls-byo.yaml /tmp/lab-external.yaml

      - name: Kubernetes schema (kubeconform)
        run: kubeconform -summary -ignore-missing-schemas /tmp/lab.yaml /tmp/lab-manual.yaml /tmp/lab-autoscale.yaml /tmp/lab-metrics.yaml /tmp/lab-tls.yaml /tmp/lab-tls-byo.yaml /tmp/lab-external.yaml

      - name: yamllint
        run: yamllint -f parsable manifests .github

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Markdown structure
        uses: DavidAnson/markdownlint-cli2-action@v24

      - name: Spelling
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --quiet codespell==2.4.3
          "$HOME/venv/bin/codespell"

      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config ./lychee.toml --no-progress "**/*.md"

      - name: Workflows
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin actionlint
          actionlint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
