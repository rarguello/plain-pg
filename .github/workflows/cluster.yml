name: cluster (microshift)

# Experimental: runs the suite against a throwaway MicroShift cluster created by
# MINC (MicroShift-in-a-container). Manual or nightly only, and a separate
# workflow, so a flaky run can never block a pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microshift:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install podman, oc and minc
        run: |
          sudo apt-get update -qq
          # The distro podman on ubuntu-22.04 (3.4.x) is too old for MINC; the
          # Kubic repo ships 4.x.
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_22.04/Release.key" \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/kubic.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/kubic.gpg] https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_22.04/ /" \
            | sudo tee /etc/apt/sources.list.d/kubic.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.19/openshift-client-linux.tar.gz \
            | sudo tar xz -C /usr/local/bin oc kubectl
          curl -sSL https://github.com/minc-org/minc/releases/download/v0.2.0/minc_linux_amd64 -o /tmp/minc
          sudo install -m 0755 /tmp/minc /usr/local/bin/minc

      - name: Red Hat pull secret
        env:
          RH_PULL_SECRET: ${{ secrets.RH_PULL_SECRET }}
        run: printf '%s' "$RH_PULL_SECRET" > "$HOME/.pull-secret.json"

      - name: Start MINC (MicroShift)
        run: |
          free -m; df -h / || true
          minc create
          # Diagnostics: if the container exits, show why before failing.
          sudo podman ps -a || true
          sudo podman inspect microshift --format 'status={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' || true
          sudo podman logs microshift 2>&1 | tail -120 || true
          minc status || true
          minc generate-kubeconfig
          oc get nodes

      - name: Prepare the cluster (storage + pull secret)
        run: ./scripts/minc-up.sh

      - name: Run the suite
        env:
          STORAGE_CLASS: local-path
        run: ./tests/run-all.sh quick | tee /tmp/suite.txt

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microshift-suite
          path: /tmp/suite.txt
          if-no-files-found: ignore
