name: cluster (microshift)

# Experimental: runs the suite against a throwaway MicroShift cluster created by
# MINC (MicroShift-in-a-container). Manual or nightly only, and a separate
# workflow, so a flaky run can never block a pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microshift:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install podman, oc and minc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.19/openshift-client-linux.tar.gz \
            | sudo tar xz -C /usr/local/bin oc kubectl
          curl -sSL https://github.com/minc-org/minc/releases/download/v0.2.0/minc_linux_amd64 -o /tmp/minc
          sudo install -m 0755 /tmp/minc /usr/local/bin/minc

      - name: Red Hat pull secret
        env:
          RH_PULL_SECRET: ${{ secrets.RH_PULL_SECRET }}
        run: printf '%s' "$RH_PULL_SECRET" > "$HOME/.pull-secret.json"

      - name: Start MINC (MicroShift)
        run: |
          minc create
          minc generate-kubeconfig
          oc get nodes

      - name: Prepare the cluster (storage + pull secret)
        run: ./scripts/minc-up.sh

      - name: Run the suite
        env:
          STORAGE_CLASS: local-path
        run: |
          # On MicroShift the StatefulSet loses its replica (spec.replicas=1,
          # field manager "microshift") during a full run, which breaks the two
          # tests that need a second pod after a restart (t06, t14). Those run on
          # a real lab; this nightly covers the rest.
          ./tests/run-all.sh t01 t02 t03 t04 t05 t09 t10 t12 t18 t19 t21 t22 | tee /tmp/suite.txt

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microshift-suite
          path: /tmp/suite.txt
          if-no-files-found: ignore
