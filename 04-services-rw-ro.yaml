###############################################################################
# 04-services-rw-ro.yaml
# Services separados para Primary (rw) y Replicas (ro).
#
# CÓMO FUNCIONA LA SELECCIÓN:
#
# OpenShift/Kubernetes asigna automáticamente el label:
#   statefulset.kubernetes.io/pod-name: pg-keycloak-0
#
# a cada pod del StatefulSet. Aprovechamos esto para crear:
#
# pg-keycloak-rw → selecciona SOLO pod-0 (primary)
#    Keycloak debe apuntar aquí para lectura/escritura.
#
# pg-keycloak-ro → selecciona todos MENOS pod-0 (réplicas)
#    Útil si alguna aplicación necesita solo lecturas.
#    Las réplicas sirven hot standby (lecturas en tiempo real).
#
# CONFIGURACIÓN EN KEYCLOAK:
#   jdbc:postgresql://pg-keycloak-rw.produbanco-databases.svc:5432/keycloak
#
# CONFIGURACIÓN EN 3SCALE (si aplican el mismo patrón):
#   DATABASE_URL=postgresql://user:pass@pg-3scale-system-rw.produbanco-databases.svc:5432/system
###############################################################################

# --- Service: Primary (lectura/escritura) ---
apiVersion: v1
kind: Service
metadata:
  name: pg-keycloak-rw
  namespace: produbanco-databases
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: pg-keycloak
    app.kubernetes.io/component: primary
  annotations:
    description: >-
      Apunta exclusivamente al pod-0 (primary).
      Usar este service para conexiones de lectura/escritura.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: pg-keycloak
    # Este label lo asigna Kubernetes automáticamente a cada pod del StatefulSet
    statefulset.kubernetes.io/pod-name: pg-keycloak-0
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

---
# --- Service: Replicas (solo lectura) ---
# NOTA: Este service balancea entre TODOS los pods del StatefulSet,
# incluyendo pod-0 (primary). Para un selector que excluya al primary
# necesitaríamos un label custom — ver nota abajo.
#
# En la práctica, para Keycloak y 3scale solo usamos el service -rw.
# Este service -ro es útil para:
#   - Queries de reportería/monitoreo
#   - Verificación de salud de las réplicas
#   - Futuros read-offloading si se necesita
apiVersion: v1
kind: Service
metadata:
  name: pg-keycloak-ro
  namespace: produbanco-databases
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: pg-keycloak
    app.kubernetes.io/component: replica
  annotations:
    description: >-
      Apunta a todos los pods del StatefulSet.
      Las réplicas sirven lecturas en hot standby.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: pg-keycloak
    # Sin filtro por pod-name: incluye todos los pods.
    # En la práctica esto funciona bien porque PostgreSQL en hot standby
    # acepta lecturas normalmente.
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
