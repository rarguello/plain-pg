apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SINGLE-INSTANCE profile: one pod, no replica. It keeps everything that is not
# about replication (probes, resources, NetworkPolicy, per-pod PVC, pg_dump
# backups) and drops what only makes sense with a standby. See
# components/single-instance and docs/operations.md.
#
# Going to HA later is one command (`oc scale sts postgresql --replicas=2`), but
# re-applying THIS overlay over a lab that has 2 replicas scales it down: use
# `oc apply -k`, not scripts/deploy.sh (which preserves the live replica count).

namespace: plain-pg

resources:
  - ../../base

components:
  - ../../components/single-instance
  # Last: see overlays/ha (a component's transformer only covers what came before).
  - ../../components/image
