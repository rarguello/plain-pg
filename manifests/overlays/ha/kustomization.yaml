apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HA profile: the base (a primary and a hot standby) plus the automatic-failover
# CronJob, enabled in the role ConfigMap. It is the default for scripts/deploy.sh.
# For manual failover only (no CronJob), use overlays/ha-manual.

namespace: plain-pg

resources:
  - ../../base

components:
  - ../../components/automatic-failover

# Enable automatic failover in the role ConfigMap.
patches:
  - target:
      kind: ConfigMap
      name: postgresql-role
    patch: |-
      - op: replace
        path: /data/AUTO_FAILOVER
        value: "true"

# Red Hat's PostgreSQL 18 image, pinned by digest for reproducibility. It is a
# RHEL image: Red Hat publishes no UBI variant (see docs/image-matrix.md).
# Update the digest: see scripts/update-digest.sh
images:
  - name: registry.redhat.io/rhel10/postgresql-18
    digest: sha256:2e04d97c53cd19e9fc855195f0585925fd2a704e42cb158d9c96b57747631882
