apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HA profile: the base (a primary and a hot standby) plus the automatic-failover
# CronJob, enabled in the role ConfigMap. It is the default for scripts/deploy.sh.
# For manual failover only (no CronJob), use overlays/ha-manual.
# The PostgreSQL image is pinned in the base.

namespace: plain-pg

resources:
  - ../../base

components:
  - ../../components/automatic-failover
  # components/image goes LAST: a component's transformer only applies to the
  # resources accumulated before it, so it has to come after the components that
  # add image-bearing objects (see components/image).
  - ../../components/image

# Enable automatic failover in the role ConfigMap.
patches:
  - target:
      kind: ConfigMap
      name: postgresql-role
    patch: |-
      - op: replace
        path: /data/AUTO_FAILOVER
        value: "true"
