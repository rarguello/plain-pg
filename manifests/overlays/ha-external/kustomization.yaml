apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HA profile plus EXTERNAL access to the primary through a NodePort.
# Read the security notes in docs/operations.md first: this publishes PostgreSQL
# on every node's address, and the NetworkPolicy still blocks clients from
# outside the namespace unless you add an `ipBlock` allowlist.

namespace: plain-pg

resources:
  - ../ha

components:
  - ../../components/external-access
