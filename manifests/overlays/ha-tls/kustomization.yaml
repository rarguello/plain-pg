apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HA profile plus TLS for PostgreSQL, with the certificate issued by OpenShift's
# service-ca (nothing is stored in git).
# For your own certificate, use overlays/ha-tls-byo instead.

namespace: plain-pg

resources:
  - ../ha

components:
  - ../../components/tls
  - ../../components/tls-service-ca
