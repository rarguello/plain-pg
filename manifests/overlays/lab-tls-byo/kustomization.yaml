apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same as overlays/lab plus TLS for PostgreSQL, with YOUR OWN certificate:
# create these two objects first (nothing here generates them):
#
#   oc -n plain-pg create secret tls postgresql-tls --cert=tls.crt --key=tls.key
#   oc -n plain-pg create configmap postgresql-tls-ca --from-file=ca.crt
#
# then apply this overlay and recreate the pods (updateStrategy is OnDelete).
# The certificate must be valid for the names clients use (the headless per-pod
# DNS and the -rw/-ro Services); clients can verify it with sslmode=verify-ca.

namespace: plain-pg

resources:
  - ../lab

components:
  - ../../components/tls
