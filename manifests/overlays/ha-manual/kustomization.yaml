apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minimal HA profile: replication + MANUAL failover only. No CronJob, no RBAC,
# no automatic failover (AUTO_FAILOVER stays at "false").
# The PostgreSQL image is pinned in the base.

namespace: plain-pg

resources:
  - ../../base

components:
  - ../../components/image
