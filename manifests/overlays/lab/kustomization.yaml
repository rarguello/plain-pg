apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# COMPLETE lab overlay: base + automatic failover enabled.
# It is the one scripts/deploy.sh uses by default.

namespace: plain-pg

resources:
  - ../../base

components:
  - ../../components/automatic-failover

# Enable automatic failover in the role ConfigMap.
patches:
  - target:
      kind: ConfigMap
      name: postgresql-role
    patch: |-
      - op: replace
        path: /data/AUTO_FAILOVER
        value: "true"

# PostgreSQL 18 image on UBI10, pinned by digest for reproducibility.
# Update the digest: see scripts/update-digest.sh
images:
  - name: registry.redhat.io/rhel10/postgresql-18
    digest: sha256:2e04d97c53cd19e9fc855195f0585925fd2a704e42cb158d9c96b57747631882
