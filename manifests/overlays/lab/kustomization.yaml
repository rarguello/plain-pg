apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de laboratorio COMPLETO: base + failover automatico habilitado.
# Es el que usa scripts/deploy.sh por defecto.

namespace: pg-ha-lab

resources:
  - ../../base

components:
  - ../../components/failover-automatico

# Habilitar el failover automatico en el ConfigMap de rol.
patches:
  - target:
      kind: ConfigMap
      name: postgres-role
    patch: |-
      - op: replace
        path: /data/AUTO_FAILOVER
        value: "true"

# Imagen de PostgreSQL 18 sobre UBI10, fijada por digest para reproducibilidad.
# Actualizar el digest: ver scripts/actualizar-digest.sh
images:
  - name: registry.redhat.io/rhel10/postgresql-18
    digest: sha256:8b0fd3d5aa1c6ae25da4dc4dfd04fe9de2a47359b57aa4c9b82cede2c3da814a
