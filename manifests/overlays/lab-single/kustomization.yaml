apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SINGLE-INSTANCE overlay: one pod, no replica. It keeps everything that is not
# about replication (pinned UBI image, non-root, probes, resources,
# NetworkPolicy, per-pod PVC, pg_dump backups), and drops what only makes sense
# with a standby:
#   - the StatefulSet runs 1 replica;
#   - no automatic-failover CronJob (there is nothing to promote);
#   - no postgresql-ro Service (it pins a replica that does not exist); read
#     through postgresql-r, which selects the single instance.
# There is no HA: a restart, an upgrade or a node failure is downtime, and the
# dumps on postgresql-backups are the only recovery. See docs/operations.md.
#
# Re-applying this over a lab that has 2 replicas scales it down: use
# `oc apply -k` (or `oc scale sts postgresql --replicas=1`), because
# scripts/deploy.sh preserves the live replica count on purpose.

namespace: plain-pg

resources:
  - ../../base

patches:
  - target:
      kind: StatefulSet
      name: postgresql
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgresql
      spec:
        replicas: 1

  # A Service with no endpoints is a trap: remove it instead of leaving it
  # pointing at a pod that is not part of this profile.
  - target:
      kind: Service
      name: postgresql-ro
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgresql-ro
      $patch: delete

# PostgreSQL 18 image on UBI10, pinned by digest for reproducibility.
# Update the digest: see scripts/update-digest.sh
images:
  - name: registry.redhat.io/rhel10/postgresql-18
    digest: sha256:2e04d97c53cd19e9fc855195f0585925fd2a704e42cb158d9c96b57747631882
