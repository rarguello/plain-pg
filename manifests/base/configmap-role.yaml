###############################################################################
# configmap-role.yaml
#
# "Source of truth" for who the primary is. It is a plain ConfigMap, editable
# with `oc patch`, and it is the only thing that must change to promote a
# replica.
#
#   PRIMARY_POD   name of the pod that must be primary. The rest are replicas.
#   AUTO_FAILOVER "true"/"false": enables/disables automatic failover
#                 (read by the CronJob of the failover-automatico component).
#   FAILOVER_GRACE_SECONDS  how long to wait for the primary to come back
#                 before declaring it down (read by the CronJob).
#
# Pods read PRIMARY_POD ONLY at startup. After changing this ConfigMap the
# affected pods must be restarted (the failover scripts do it).
###############################################################################

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-role
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: database
data:
  PRIMARY_POD: "postgresql-0"
  AUTO_FAILOVER: "false"
  FAILOVER_GRACE_SECONDS: "120"
