###############################################################################
# networkpolicy.yaml
#
# INGRESS-only policy (egress is not restricted, to avoid breaking DNS or
# access to the API server). It allows any pod in the namespace to talk to
# PostgreSQL on 5432, and nothing else from outside the namespace.
#
# kubelet probes are not affected by NetworkPolicy.
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-ingress
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgresql
  policyTypes:
    - Ingress
  ingress:
    # Clients inside the namespace (apps, the failover CronJob, debug psql).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Replication between the PostgreSQL pods themselves.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: postgresql
      ports:
        - protocol: TCP
          port: 5432
