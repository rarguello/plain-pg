###############################################################################
# networkpolicy.yaml
#
# INGRESS-only policy (egress is not restricted, to avoid breaking DNS or
# access to the API server). It allows any pod in the namespace to reach
# PostgreSQL on 5432 -- clients (apps, debug psql), replication between the DB
# pods, and the backup/failover Jobs. NetworkPolicies are additive, so this does
# not isolate the pods from each other; it only limits traffic from outside the
# namespace.
#
# kubelet probes are not affected by NetworkPolicy.
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-ingress
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgresql
  policyTypes:
    - Ingress
  ingress:
    # Any pod in the namespace, on 5432: clients, replication and the Jobs.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
