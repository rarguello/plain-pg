###############################################################################
# cronjob-backup.yaml
#
# Backup diario. Corre contra el Service postgres-rw, por lo que sigue
# automaticamente al primary actual (incluso despues de un failover).
#
# OJO: las labels del pod NO deben coincidir con las de los pods de la BD, o el
# pod del backup entraria como endpoint de los Services de PostgreSQL.
###############################################################################

apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/instance: pg-ha
    app.kubernetes.io/part-of: pg-ha
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
            app.kubernetes.io/instance: pg-ha
            app.kubernetes.io/part-of: pg-ha
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.redhat.io/rhel10/postgresql-18:latest
              command: ["/bin/bash", "/scripts/backup.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - secretRef:
                    name: postgres-credentials
              env:
                - name: BACKUP_HOST
                  value: postgres-rw
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_RETENTION_DAYS
                  value: "7"
                - name: PGPORT
                  value: "5432"
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  memory: "512Mi"
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: scripts
              configMap:
                name: postgres-backup-scripts
                defaultMode: 0755
                items:
                  - key: backup.sh
                    path: backup.sh
                  - key: restore.sh
                    path: restore.sh
