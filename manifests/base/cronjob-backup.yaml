###############################################################################
# cronjob-backup.yaml
#
# Daily backup. It runs against the postgresql-rw Service, so it automatically
# follows the current primary (even after a failover).
#
# NOTE: the pod labels must NOT match those of the DB pods, or the backup pod
# would enter as an endpoint of the PostgreSQL Services.
###############################################################################

apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
            app.kubernetes.io/instance: plain-pg
            app.kubernetes.io/part-of: plain-pg
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # The Job never calls the API server.
          automountServiceAccountToken: false
          containers:
            - name: backup
              # Logical name: components/image maps it to the real, pinned image.
              image: postgresql
              command: ["/bin/bash", "/scripts/backup.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Only the keys backup.sh uses: the app user/database and the
              # superuser password for pg_dumpall --globals-only. Not the
              # replication credentials.
              env:
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef: { name: postgresql-credentials, key: POSTGRESQL_USER }
                - name: POSTGRESQL_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgresql-credentials, key: POSTGRESQL_PASSWORD }
                - name: POSTGRESQL_DATABASE
                  valueFrom:
                    secretKeyRef: { name: postgresql-credentials, key: POSTGRESQL_DATABASE }
                - name: POSTGRESQL_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgresql-credentials, key: POSTGRESQL_ADMIN_PASSWORD }
                - name: BACKUP_HOST
                  value: postgresql-rw
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_RETENTION_DAYS
                  value: "7"
                - name: PGPORT
                  value: "5432"
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  memory: "512Mi"
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgresql-backups
            - name: scripts
              configMap:
                name: postgresql-backup-scripts
                defaultMode: 0755
                items:
                  - key: backup.sh
                    path: backup.sh
                  - key: restore.sh
                    path: restore.sh
