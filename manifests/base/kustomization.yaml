apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "Pure" base: Kubernetes core objects, no namespace, no image pin. It is always
# used through an overlay (overlays/ha, overlays/ha-manual, overlays/single...),
# and every profile includes components/image, which is the one place the
# PostgreSQL image is pinned.

resources:
  - configmap-scripts.yaml
  - configmap-role.yaml
  - configmap-backup-scripts.yaml
  - pvc-backups.yaml
  - services.yaml
  - statefulset.yaml
  - cronjob-backup.yaml
  - networkpolicy.yaml

# The Namespace is NOT here on purpose: a base meant to be reused should not fix
# a cluster-scoped name. The example namespace is manifests/namespace.yaml, and
# an overlay that wants a different one just sets `namespace:` (or creates its
# own, see docs/operations.md#deploy-with-your-own-values).
