apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "Pure" base: Kubernetes core objects, no namespace, no image pin. It is always
# used through an overlay (overlays/ha, overlays/ha-manual, overlays/single...),
# and every profile includes components/image, which is the one place the
# PostgreSQL image is pinned.

resources:
  - namespace.yaml
  - configmap-scripts.yaml
  - configmap-role.yaml
  - configmap-backup-scripts.yaml
  - pvc-backups.yaml
  - services.yaml
  - statefulset.yaml
  - cronjob-backup.yaml
  - networkpolicy.yaml

# namespace.yaml carries the PodSecurity profile, and it is here so that
# `oc apply -k` deploys in one command. An overlay that sets `namespace:` renames
# it (kustomize renames a Namespace object too), labels included, so it does not
# force the example name on anyone.
