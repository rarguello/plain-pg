apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "Pure" base: Kubernetes core objects, no namespace, no pinned image.
# It is always used through an overlay (overlays/ha, overlays/ha-manual).

resources:
  - namespace.yaml
  - configmap-scripts.yaml
  - configmap-role.yaml
  - configmap-backup-scripts.yaml
  - pvc-backups.yaml
  - services.yaml
  - statefulset.yaml
  - cronjob-backup.yaml
  - networkpolicy.yaml
