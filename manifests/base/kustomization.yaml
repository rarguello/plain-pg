apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "Pure" base: Kubernetes core objects, no namespace, no image pin. It is always
# used through an overlay (overlays/ha, overlays/ha-manual, overlays/single...),
# and every profile includes components/image, which is the one place the
# PostgreSQL image is pinned.

resources:
  - configmap-scripts.yaml
  - configmap-role.yaml
  - configmap-backup-scripts.yaml
  - pvc-backups.yaml
  - services.yaml
  - statefulset.yaml
  - cronjob-backup.yaml
  - networkpolicy.yaml

# No Namespace object on purpose: this is a deployment, not an environment, and
# creating a cluster-scoped object is the operator's decision. Create the
# namespace (with the PodSecurity labels) first; scripts/deploy.sh does it for the
# lab, and docs/operations.md#deploy shows the commands.
