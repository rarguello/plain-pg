###############################################################################
# statefulset.yaml
#
# StatefulSet de PostgreSQL 18 (UBI) con replicacion streaming.
#
#   postgres-0 -> primary (lectura/escritura)
#   postgres-1 -> replica (hot standby, solo lectura)
#
# El rol NO se deriva del ordinal en duro: se lee del ConfigMap postgres-role.
# Por defecto postgres-0 es primary, pero tras un failover el primary puede ser
# otro ordinal. Ver docs/04-failover-manual.md.
#
# Reutiliza la imagen sclorg (registry.redhat.io/rhel10/postgresql-18):
#   - PGDATA real = /var/lib/pgsql/data/userdata (lo fija set_pgdata)
#   - initdb + creacion de usuario/db los hace el entrypoint de la imagen
#   - nuestro entrypoint solo decide el rol y prepara el PGDATA
###############################################################################

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: pg-ha
    app.kubernetes.io/component: database
spec:
  replicas: 2
  serviceName: postgres-hl

  # OrderedReady: postgres-0 arranca y queda Ready ANTES de que postgres-1
  # intente hacer pg_basebackup. Critico para el arranque de la replica.
  podManagementPolicy: OrderedReady

  # OnDelete: cambiar el template NO reinicia pods automaticamente. En una BD
  # eso es lo correcto (nada de restarts sorpresa por un `oc apply`). Para
  # aplicar un cambio de template hay que borrar los pods a mano.
  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/part-of: pg-ha
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 120

      # Cumple PodSecurity "restricted" y el SCC restricted-v2 de OpenShift.
      # NO se fija fsGroup: OpenShift asigna uno del rango del namespace y deja
      # el PVC escribible por el contenedor (UID aleatorio + ese grupo).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # No poner los dos pods en el mismo nodo si hay >1 nodo.
      # preferred (no required) para no bloquear en clusters de 1 nodo (SNO).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgresql
                    app.kubernetes.io/instance: postgres

      containers:
        - name: postgresql
          image: registry.redhat.io/rhel10/postgresql-18:latest
          command:
            - /bin/bash
            - /opt/app-root/src/bin/configure-and-run.sh

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # Credenciales: POSTGRESQL_USER/PASSWORD/DATABASE (usuario de la app),
          # POSTGRESQL_ADMIN_PASSWORD (superusuario postgres) y
          # POSTGRESQL_MASTER_USER/PASSWORD (usuario de replicacion).
          envFrom:
            - secretRef:
                name: postgres-credentials

          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HL_SERVICE
              value: postgres-hl
            - name: PGPORT
              value: "5432"
            - name: ROLE_FILE
              value: /etc/pg-ha/role/PRIMARY_POD
            - name: WAIT_PRIMARY_RETRIES
              value: "120"

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"

          startupProbe:
            exec:
              command: ["/bin/bash", "/opt/app-root/src/bin/healthcheck.sh"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60      # hasta 5 min (pg_basebackup incluido)

          readinessProbe:
            exec:
              command: ["/bin/bash", "/opt/app-root/src/bin/healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command: ["/bin/bash", "/opt/app-root/src/bin/healthcheck.sh", "live"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - 'pg_ctl -D "${HOME}/data/userdata" -m fast -w stop || true'

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
            - name: scripts
              mountPath: /opt/app-root/src/bin
              readOnly: true
            - name: role
              mountPath: /etc/pg-ha/role
              readOnly: true

      volumes:
        - name: scripts
          configMap:
            name: postgres-scripts
            defaultMode: 0755
            items:
              - key: configure-and-run.sh
                path: configure-and-run.sh
              - key: healthcheck.sh
                path: healthcheck.sh
        - name: role
          configMap:
            name: postgres-role

  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: postgres
          app.kubernetes.io/part-of: pg-ha
      spec:
        accessModes:
          - ReadWriteOnce
        # Sin storageClassName: usa la StorageClass por defecto del cluster.
        resources:
          requests:
            storage: 2Gi
