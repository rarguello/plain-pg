###############################################################################
# statefulset.yaml
#
# PostgreSQL 18 StatefulSet with streaming replication.
#
#   postgresql-0 -> primary (read/write)
#   postgresql-1 -> replica (hot standby, read-only)
#
# The role is NOT derived from the ordinal in a hardcoded way: it is read from
# the postgresql-role ConfigMap. By default postgresql-0 is primary, but after a
# failover the primary may be another ordinal. See docs/failover.md.
#
# Reuses the sclorg image (registry.redhat.io/rhel10/postgresql-18):
#   - real PGDATA = /var/lib/pgsql/data/userdata (set by set_pgdata)
#   - initdb + user/db creation are done by the image entrypoint
#   - our entrypoint only decides the role and prepares PGDATA
###############################################################################

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: database
spec:
  replicas: 2
  serviceName: postgresql-hl

  # Parallel: pods are created without depending on order. Needed because,
  # after a failover, the primary may be postgresql-1: if both pods are recreated
  # at once, with OrderedReady the StatefulSet would wait for postgresql-0 (now a
  # replica) to be Ready before creating postgresql-1, and postgresql-0 waits for
  # its primary -> deadlock. Each replica waits for the primary explicitly in
  # the entrypoint (wait_for_primary), so the order is not needed.
  podManagementPolicy: Parallel

  # OnDelete: changing the template does NOT restart pods automatically. On a
  # DB that is the right thing (no surprise restarts from an `oc apply`). To
  # apply a template change the pods must be deleted by hand.
  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: postgresql

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: postgresql
        app.kubernetes.io/part-of: plain-pg
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 120
      # The pods never call the API server (the namespace comes from the
      # downward API), so they do not need a ServiceAccount token.
      automountServiceAccountToken: false

      # Satisfies PodSecurity "restricted" and OpenShift's restricted-v2 SCC.
      # fsGroup is NOT set: OpenShift assigns one from the namespace range and
      # leaves the PVC writable by the container (random UID + that group).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Do not put both pods on the same node if there is more than 1 node.
      # preferred (not required) so it does not block on 1-node clusters (SNO).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgresql
                    app.kubernetes.io/instance: postgresql

      containers:
        - name: postgresql
          # The image digest is pinned in base/kustomization.yaml (the name here
          # is what the kustomize `images:` transformer matches).
          image: registry.redhat.io/rhel10/postgresql-18:latest
          command:
            - /bin/bash
            - /opt/app-root/src/bin/configure-and-run.sh

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # Credentials: POSTGRESQL_USER/PASSWORD/DATABASE (app user),
          # POSTGRESQL_ADMIN_PASSWORD (postgres superuser) and
          # POSTGRESQL_MASTER_USER/PASSWORD (replication user).
          envFrom:
            - secretRef:
                name: postgresql-credentials

          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HL_SERVICE
              value: postgresql-hl
            - name: PGPORT
              value: "5432"
            - name: ROLE_FILE
              value: /etc/plain-pg/role/PRIMARY_POD
            - name: WAIT_PRIMARY_RETRIES
              value: "180"

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"

          startupProbe:
            exec:
              command: ["/bin/bash", "/opt/app-root/src/bin/healthcheck.sh"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60      # up to 5 min (pg_basebackup included)

          readinessProbe:
            exec:
              command: ["/bin/bash", "/opt/app-root/src/bin/healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command: ["/bin/bash", "/opt/app-root/src/bin/healthcheck.sh", "live"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - 'pg_ctl -D "${HOME}/data/userdata" -m fast -w stop || true'

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
            - name: scripts
              mountPath: /opt/app-root/src/bin
              readOnly: true
            - name: role
              mountPath: /etc/plain-pg/role
              readOnly: true

      volumes:
        - name: scripts
          configMap:
            name: postgresql-scripts
            defaultMode: 0755
            items:
              - key: configure-and-run.sh
                path: configure-and-run.sh
              - key: healthcheck.sh
                path: healthcheck.sh
        - name: role
          configMap:
            name: postgresql-role

  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: postgresql
          app.kubernetes.io/part-of: plain-pg
      spec:
        accessModes:
          - ReadWriteOnce
        # No storageClassName: uses the cluster default StorageClass.
        resources:
          requests:
            storage: 2Gi
