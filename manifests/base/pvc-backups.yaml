###############################################################################
# pvc-backups.yaml
#
# PVC dedicated to backups. Separate from the data PVC so that it survives a
# rebuild of the database and does not compete for access to the PostgreSQL
# volume.
###############################################################################

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-backups
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
