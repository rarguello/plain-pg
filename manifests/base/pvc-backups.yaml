###############################################################################
# pvc-backups.yaml
#
# PVC dedicado a los backups. Separado del PVC de datos para que sobreviva a
# un rebuild de la base y no compita por el acceso al volumen de PostgreSQL.
###############################################################################

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: pg-ha
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
