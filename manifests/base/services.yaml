###############################################################################
# services.yaml
#
# Four Services. -rw and -ro select by pod name (not by role), so a failover
# repoints them (scripts/failover-manual.sh and the automatic CronJob do it).
# -r selects every Ready instance and never needs repointing. -ro pins exactly
# one replica, so with more than one replica use -r (or add the extra names).
###############################################################################

# --- Headless: stable DNS between pods ---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-hl
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  # Resolve pods by DNS even before they pass the readiness probe. Needed so a
  # replica can reach the primary while it is still starting up.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

---
# --- Read/Write: the primary only ---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-rw
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: primary
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    statefulset.kubernetes.io/pod-name: postgresql-0
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

---
# --- Read-only, load-balanced across every instance ---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-r
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: read
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

---
# --- Read-only: the replica(s) ---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-ro
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: replica
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    statefulset.kubernetes.io/pod-name: postgresql-1
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
