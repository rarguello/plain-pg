###############################################################################
# configmap-backup-scripts.yaml
#
# Logical backups with pg_dump. It is the simplest thing that works:
#   - pg_dumpall --globals-only  -> roles/users
#   - pg_dump -Fc <database>     -> application data (custom format, restorable)
#   - retention by age
#   - it runs against the postgresql-rw Service, so it follows the current primary
#
# It is NOT PITR (there is no WAL archiving). See docs/backups.md.
###############################################################################

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-backup-scripts
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: backup
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    HOST="${BACKUP_HOST:-postgresql-rw}"
    PORT="${PGPORT:-5432}"
    ADMIN_USER="${BACKUP_ADMIN_USER:-postgres}"
    APP_USER="${POSTGRESQL_USER:-app}"
    APP_DB="${POSTGRESQL_DATABASE:-appdb}"
    DEST="${BACKUP_DIR:-/backups}"
    RETENTION_DAYS="${BACKUP_RETENTION_DAYS:-7}"
    TS="$(date -u +%Y%m%d-%H%M%S)"

    log() { echo "[pg-backup] $*"; }
    mkdir -p "$DEST"

    log "source: ${HOST}:${PORT}  destination: ${DEST}  retention: ${RETENTION_DAYS}d"

    # 1. Global roles and users
    PGPASSWORD="${POSTGRESQL_ADMIN_PASSWORD:-}" \
      pg_dumpall -h "$HOST" -p "$PORT" -U "$ADMIN_USER" --globals-only \
      > "${DEST}/${TS}-globals.sql"
    log "globals -> ${TS}-globals.sql"

    # 2. Application database (custom format)
    PGPASSWORD="${POSTGRESQL_PASSWORD:-}" \
      pg_dump -h "$HOST" -p "$PORT" -U "$APP_USER" -d "$APP_DB" -Fc \
      -f "${DEST}/${TS}-${APP_DB}.dump"
    log "database -> ${TS}-${APP_DB}.dump"

    # 3. Verification: the dump must be listable
    pg_restore -l "${DEST}/${TS}-${APP_DB}.dump" >/dev/null
    log "backup verified (pg_restore -l OK)"

    # 4. Retention
    log "deleting backups older than ${RETENTION_DAYS} days"
    find "$DEST" -maxdepth 1 -type f \( -name '*.dump' -o -name '*-globals.sql' \) \
      -mtime +"${RETENTION_DAYS}" -print -delete || true

    log "current contents of ${DEST}:"
    ls -lh "$DEST" | sed 's/^/  /'
    log "OK"

  restore.sh: |
    #!/bin/bash
    # Usage: restore.sh <file.dump> [target_database]
    #
    # Always restores into a NEW database: it does not overwrite existing
    # databases and rejects the application database. Uses --exit-on-error: if
    # anything fails, the created database is dropped.
    set -euo pipefail

    DUMP="${1:?usage: restore.sh <file.dump> [database]}"
    TARGET="${2:-restore_$(date -u +%Y%m%d_%H%M%S)}"
    HOST="${BACKUP_HOST:-postgresql-rw}"
    PORT="${PGPORT:-5432}"
    ADMIN_USER="${BACKUP_ADMIN_USER:-postgres}"
    APP_DB="${POSTGRESQL_DATABASE:-appdb}"

    log() { echo "[pg-restore] $*"; }
    [ -f "$DUMP" ] || { log "ERROR: $DUMP does not exist"; exit 1; }

    # The name is used as a SQL identifier: it is validated strictly.
    case "$TARGET" in
      *[!A-Za-z0-9_]*|[0-9]*)
        log "ERROR: invalid database name: '$TARGET' (only [A-Za-z_][A-Za-z0-9_]*)"
        exit 1 ;;
    esac
    if [ "$TARGET" = "$APP_DB" ]; then
      log "ERROR: the target cannot be the application database ($APP_DB)"; exit 1
    fi

    export PGPASSWORD="${POSTGRESQL_ADMIN_PASSWORD:-}"

    EXISTS="$(psql -h "$HOST" -p "$PORT" -U "$ADMIN_USER" -d postgres -tAc \
              "SELECT 1 FROM pg_database WHERE datname='${TARGET}'")"
    if [ "$EXISTS" = "1" ]; then
      log "ERROR: database ${TARGET} already exists. Choose another name (this script does not overwrite databases)."
      exit 1
    fi

    log "creating target database ${TARGET}"
    psql -h "$HOST" -p "$PORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 \
      -c "CREATE DATABASE \"${TARGET}\";"

    log "restoring ${DUMP} into ${TARGET}"
    if ! pg_restore -h "$HOST" -p "$PORT" -U "$ADMIN_USER" -d "$TARGET" \
           --no-owner --no-privileges --exit-on-error "$DUMP"; then
      log "ERROR: restore failed; dropping the incomplete database ${TARGET}"
      psql -h "$HOST" -p "$PORT" -U "$ADMIN_USER" -d postgres \
        -c "DROP DATABASE IF EXISTS \"${TARGET}\";" || true
      exit 1
    fi

    log "restored tables:"
    psql -h "$HOST" -p "$PORT" -U "$ADMIN_USER" -d "$TARGET" -P pager=off \
      -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY 1;"
    log "OK -> database ${TARGET}"
