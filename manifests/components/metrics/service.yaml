apiVersion: v1
kind: Service
metadata:
  name: postgresql-metrics
  labels:
    app.kubernetes.io/name: pg-metrics
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: pg-metrics
    app.kubernetes.io/instance: plain-pg
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
      protocol: TCP
