apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Optional component: PostgreSQL metrics for Prometheus (postgres_exporter, a
# Service and a ServiceMonitor). Needs the monitoring.coreos.com CRDs, so it is
# not part of the base; include it from an overlay (overlays/lab-metrics).

resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

patches:
  # Let the cluster monitoring Prometheus scrape this namespace.
  - target:
      kind: Namespace
      name: plain-pg
    patch: |-
      - op: add
        path: /metadata/labels/openshift.io~1cluster-monitoring
        value: "true"
