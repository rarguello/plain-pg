apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Optional component: publish the primary outside the cluster through a NodePort
# on postgresql-rw. A failover already repoints its selector, so external clients
# follow the new primary automatically.
#
# Read the security notes in docs/operations.md first: this publishes PostgreSQL
# on every node's address. externalTrafficPolicy: Local preserves the client's
# source IP, which is what the NetworkPolicy `ipBlock` matches (Cluster would SNAT
# it to the node).

patches:
  - target:
      kind: Service
      name: postgresql-rw
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/externalTrafficPolicy
        value: Local
      - op: add
        path: /spec/ports/0/nodePort
        value: 30432
