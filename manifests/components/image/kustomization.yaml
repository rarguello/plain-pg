apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The PostgreSQL image, in ONE place for every overlay.
#
# The resources use the logical name `postgresql`; this transformer maps it to the
# real, pinned image. Two reasons for the indirection:
#   - a kustomization applies its `images:` transformer only to the resources it
#     builds itself, so the base cannot pin the images that components add (the
#     failover CronJob); as a component, included last, this one covers everything;
#   - moving to another platform or PostgreSQL version is then a single edit:
#     `newName` and `digest` here (scripts/update-digest.sh --apply updates the
#     digest of the same image).
#
# After a major version change, wipe the PGDATA PVCs (PostgreSQL refuses to start
# on a data directory from another major) and recreate the pods.
# scripts/test-image.sh does all of that for one combination and runs the suite;
# docs/supported-images.md has the table of what has been tested.

images:
  - name: postgresql
    newName: registry.redhat.io/rhel10/postgresql-18
    digest: sha256:b177f67c18c341e1fc235c11845d408e5fe8cb3e91eaa538b6ce4caa4f80d86b
