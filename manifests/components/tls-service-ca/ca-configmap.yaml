apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-tls-ca
  labels:
    app.kubernetes.io/name: pg-tls
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: tls
  annotations:
    # OpenShift fills this with the service-ca CA bundle (key: service-ca.crt).
    service.beta.openshift.io/inject-cabundle: "true"
