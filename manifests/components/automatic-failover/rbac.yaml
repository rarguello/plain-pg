###############################################################################
# rbac.yaml
#
# MINIMAL permissions for the automatic failover CronJob. Everything scoped to
# the namespace (Role, not ClusterRole) and, where possible, to specific
# resources.
#
# Note: pod deletion cannot be scoped by name (StatefulSet pods have variable
# names), so it stays at the namespace level.
###############################################################################

apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-failover
  labels:
    app.kubernetes.io/name: pg-failover
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: failover

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-failover
  labels:
    app.kubernetes.io/name: pg-failover
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: failover
rules:
  # Read the declared role and the pods; isolate (delete) the ex-primary.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Read and update ONLY the role ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
    resourceNames: ["postgresql-role"]
  # Repoint ONLY the DB Services (and read them to verify).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
    resourceNames: ["postgresql-rw", "postgresql-ro"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-failover
  labels:
    app.kubernetes.io/name: pg-failover
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: failover
subjects:
  - kind: ServiceAccount
    name: postgresql-failover
roleRef:
  kind: Role
  name: postgresql-failover
  apiGroup: rbac.authorization.k8s.io
