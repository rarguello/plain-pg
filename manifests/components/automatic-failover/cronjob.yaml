###############################################################################
# cronjob.yaml
#
# Runs the failover controller every minute. `concurrencyPolicy: Forbid`
# prevents two runs from overlapping.
#
# The CronJob pod is STATELESS: it reads the declared role from the API on each
# run (not from environment variables, which would go stale if a manual failover
# changes the ConfigMap while the pod starts).
#
# Credentials: ONLY the application user (enough for
# `SELECT pg_is_in_recovery()`). The superuser one is not passed to it.
###############################################################################

apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-failover
  labels:
    app.kubernetes.io/name: pg-failover
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: failover
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          # NOTE: these labels must NOT match those of the DB pods, or the
          # CronJob pod would enter as an endpoint of the PostgreSQL Services
          # (postgresql-hl/-rw/-ro).
          labels:
            app.kubernetes.io/name: pg-failover
            app.kubernetes.io/instance: plain-pg
            app.kubernetes.io/part-of: plain-pg
            app.kubernetes.io/component: failover
        spec:
          serviceAccountName: postgresql-failover
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: failover-controller
              image: registry.redhat.io/rhel10/postgresql-18:latest
              command: ["/bin/bash", "/scripts/failover-controller.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: HL_SERVICE
                  value: postgresql-hl
                - name: PGPORT
                  value: "5432"
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: POSTGRESQL_USER
                - name: POSTGRESQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: POSTGRESQL_PASSWORD
                - name: POSTGRESQL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: POSTGRESQL_DATABASE
              resources:
                requests:
                  cpu: "20m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: postgresql-failover-scripts
                defaultMode: 0755
                items:
                  - key: failover-controller.sh
                    path: failover-controller.sh
