###############################################################################
# configmap-controller.yaml
#
# Automatic failover controller (it is NOT an operator: it is a script in a
# CronJob).
#
# Sequence:
#   1. Reads the postgresql-role ConfigMap FRESH from the API.
#   2. If the declared primary responds, it does nothing.
#   3. If it does not respond, it waits FAILOVER_GRACE_SECONDS (in case it is
#      transient).
#   4. Picks a healthy replica (pg_is_in_recovery() = t).
#   5. RE-READS the ConfigMap: if the role changed or automatic failover was
#      disabled during the grace period (e.g. a manual failover), it aborts.
#   6. Declares the candidate as primary (with resourceVersion control) and
#      repoints the Services.
#   7. Verifiable FENCING of the ex-primary: deletes it and waits to confirm
#      that the pod disappeared or changed UID. Distinguishes "does not exist"
#      (404) from an API error: on an unknown error it aborts and reverts.
#   8. Promotes the candidate (recreates the pod) and confirms.
#
# Fencing LIMITATION (read docs/failover.md): if the NODE of the ex-primary
# becomes partitioned from the API server, the pod object may disappear when the
# grace period expires even though the container is still alive. There is no
# real STONITH.
###############################################################################

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-failover-scripts
  labels:
    app.kubernetes.io/name: pg-failover
    app.kubernetes.io/instance: plain-pg
    app.kubernetes.io/part-of: plain-pg
    app.kubernetes.io/component: failover
data:
  failover-controller.sh: |
    #!/bin/bash
    set -uo pipefail

    # Logs go to STDERR: api_raw() is used inside command substitutions and we
    # do not want a message mixed into the captured body.
    log() { echo "[pg-failover][$(date -u +%FT%TZ)] $*" >&2; }

    # The API may return JSON with indentation (multiline); it is compacted
    # before parsing with grep.
    json_compact() { tr -d ' \n\r\t'; }
    json_field() {   # json_field <json> <key>
      printf '%s' "$1" | json_compact \
        | grep -o "\"$2\":\"[^\"]*\"" | head -1 | cut -d'"' -f4
    }

    SA=/var/run/secrets/kubernetes.io/serviceaccount
    API="https://kubernetes.default.svc"
    TOKEN="$(cat "$SA/token")"
    CACERT="$SA/ca.crt"
    NS="${POD_NAMESPACE:-$(cat "$SA/namespace" 2>/dev/null || echo default)}"

    HL="${HL_SERVICE:-postgresql-hl}"
    PGPORT="${PGPORT:-5432}"
    PROMOTE_TIMEOUT="${PROMOTE_TIMEOUT:-240}"
    FENCE_TIMEOUT="${FENCE_TIMEOUT:-120}"

    # App credential: enough for SELECT pg_is_in_recovery(). The superuser one
    # is not used.
    PGUSER="${POSTGRESQL_USER:-app}"
    PGDB="${POSTGRESQL_DATABASE:-postgres}"
    export PGPASSWORD="${POSTGRESQL_PASSWORD:-}"
    export PGCONNECT_TIMEOUT=5          # do not hang against an isolated primary

    # --- Kubernetes API ----------------------------------------------------
    API_CODE=""
    api_raw() {   # api_raw <METHOD> <PATH> [curl args...] -> body; code in API_CODE
      local method="$1" path="$2"; shift 2
      local tmp
      tmp="$(mktemp)"
      API_CODE="$(curl -sS --connect-timeout 5 --max-time 30 \
                    --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                    -X "$method" -o "$tmp" -w '%{http_code}' \
                    "${API}${path}" "$@" 2>/dev/null || echo 000)"
      cat "$tmp"; rm -f "$tmp"
    }
    api() {   # api <METHOD> <PATH> [args...] -> body; exit 0 if 2xx
      local method="$1" path="$2"
      api_raw "$@"
      case "$API_CODE" in
        2*) return 0 ;;
        *)  log "ERROR: API $method $path -> HTTP $API_CODE"; return 1 ;;
      esac
    }
    jsonpatch() { api PATCH "$1" -H 'Content-Type: application/merge-patch+json' -d "$2" >/dev/null; }
    delete_pod() {
      api_raw DELETE "/api/v1/namespaces/$NS/pods/$1" >/dev/null 2>&1 || true
      case "$API_CODE" in 2*|404) return 0 ;; *) log "ERROR: DELETE pod/$1 -> HTTP $API_CODE"; return 1 ;; esac
    }

    # Pod state: "gone" (404), "uid:<uid>" (exists) or "error:<code>".
    # Distinguishing 404 from a real error is critical for fencing.
    # NOTE: api_raw is called in THIS shell (redirecting stdout to a file, not
    # with $(...)), because inside a command substitution API_CODE does not come
    # back.
    pod_state() {
      local tmp body
      tmp="$(mktemp)"
      api_raw GET "/api/v1/namespaces/$NS/pods/$1" >"$tmp" 2>/dev/null || true
      body="$(cat "$tmp")"; rm -f "$tmp"
      case "$API_CODE" in
        200) printf 'uid:%s' "$(json_field "$body" uid)" ;;
        404) printf 'gone' ;;
        *)   printf 'error:%s' "$API_CODE" ;;
      esac
    }

    # 0 if the pod exists with that uid and without deletionTimestamp (intact).
    pod_intact() {   # $1 = pod, $2 = uid
      local tmp body
      tmp="$(mktemp)"
      api_raw GET "/api/v1/namespaces/$NS/pods/$1" >"$tmp" 2>/dev/null || true
      body="$(cat "$tmp")"; rm -f "$tmp"
      [ "$API_CODE" = "200" ] || return 1
      [ "$(json_field "$body" uid)" = "$2" ] || return 1
      printf '%s' "$body" | json_compact | grep -q '"deletionTimestamp":"' && return 1
      return 0
    }

    cm_get()     { api GET "/api/v1/namespaces/$NS/configmaps/postgresql-role"; }
    svc_selector() {   # svc_selector <service> -> selected pod-name
      api GET "/api/v1/namespaces/$NS/services/$1" 2>/dev/null \
        | json_compact | grep -o '"statefulset.kubernetes.io/pod-name":"[^"]*"' \
        | head -1 | cut -d'"' -f4
    }

    # --- PostgreSQL --------------------------------------------------------
    pod_fqdn() { echo "$1.${HL}.${NS}.svc.cluster.local"; }
    pg_role() {
      psql -h "$(pod_fqdn "$1")" -p "$PGPORT" -U "$PGUSER" -d "$PGDB" \
           -tAc 'SELECT pg_is_in_recovery()' 2>/dev/null
    }
    is_primary_ok() { [ "$(pg_role "$1")" = "f" ]; }
    is_standby_ok() { [ "$(pg_role "$1")" = "t" ]; }

    list_pods() {
      api GET "/api/v1/namespaces/$NS/pods?labelSelector=app.kubernetes.io/name%3Dpostgresql,app.kubernetes.io/component%3Ddatabase" \
        | json_compact \
        | grep -o "\"name\":\"${STS}-[0-9]*\"" \
        | sed -e 's/.*:"//' -e 's/"$//' | sort -u
    }

    cm_set_primary() {   # $1 = pod, $2 = resourceVersion (optional, for optimistic concurrency)
      if [ -n "${2:-}" ]; then
        jsonpatch "/api/v1/namespaces/$NS/configmaps/postgresql-role" \
          "{\"metadata\":{\"resourceVersion\":\"$2\"},\"data\":{\"PRIMARY_POD\":\"$1\"}}"
      else
        jsonpatch "/api/v1/namespaces/$NS/configmaps/postgresql-role" \
          "{\"data\":{\"PRIMARY_POD\":\"$1\"}}"
      fi
    }

    # Repoints both Services and tries both (it does not abort on the first failure).
    point_services() {   # $1 = primary, $2 = replica
      local ok=0
      jsonpatch "/api/v1/namespaces/$NS/services/postgresql-rw" \
        "{\"spec\":{\"selector\":{\"statefulset.kubernetes.io/pod-name\":\"$1\"}}}" || ok=1
      jsonpatch "/api/v1/namespaces/$NS/services/postgresql-ro" \
        "{\"spec\":{\"selector\":{\"statefulset.kubernetes.io/pod-name\":\"$2\"}}}" || ok=1
      return "$ok"
    }

    # Leaves ConfigMap + both Services at (primary, replica) and VERIFIES that
    # it ended up that way. If it cannot, it declares it inconsistent.
    restore_state() {   # $1 = primary, $2 = replica
      cm_set_primary "$1" || true
      point_services "$1" "$2" || true
      local cm rw ro
      cm="$(json_field "$(cm_get 2>/dev/null)" PRIMARY_POD)"
      rw="$(svc_selector postgresql-rw)"
      ro="$(svc_selector postgresql-ro)"
      if [ "$cm" != "$1" ] || [ "$rw" != "$1" ] || [ "$ro" != "$2" ]; then
        log "CRITICO: estado inconsistente tras revertir (CM=$cm rw=$rw ro=$ro)"
        return 1
      fi
      # The real PostgreSQL role must also be correct.
      if ! is_primary_ok "$1"; then
        log "CRITICO: tras revertir, $1 NO responde como primary. Intervencion requerida."
        return 1
      fi
      return 0
    }

    # --- Verifiable fencing -----------------------------------------------
    # Returns: 0 = isolated and confirmed; 1 = not isolated and with NO changes
    # (safe to revert); 2 = the delete was accepted but could not be confirmed
    # (do NOT revert automatically: the ex-primary may have been recreated as a
    # replica).
    fence_pod() {
      local pod="$1" state uid t=0
      state="$(pod_state "$pod")"
      case "$state" in
        gone)    log "fence: $pod no longer exists"; return 0 ;;
        error:*) log "ERROR: fence: could not query $pod ($state)"; return 1 ;;
        uid:*)   uid="${state#uid:}" ;;
      esac
      log "fence: deleting $pod (uid=${uid:0:8})"
      if ! delete_pod "$pod"; then
        # The DELETE failed. It may NOT have been accepted (safe to revert) or
        # it may have been accepted and the response was lost (NOT safe). It is
        # only reverted if the pod is still intact.
        if pod_intact "$pod" "$uid"; then
          log "ERROR: fence: could not delete $pod (still intact; no changes)"
          return 1
        fi
        log "ERROR: fence: the DELETE of $pod failed and the pod is not intact"
        return 2
      fi
      while [ "$t" -lt "$FENCE_TIMEOUT" ]; do
        sleep 5; t=$((t + 5))
        state="$(pod_state "$pod")"
        case "$state" in
          gone)    log "fence: $pod disappeared"; return 0 ;;
          error:*) log "ERROR: fence: could not confirm the termination of $pod ($state)"
                   return 2 ;;
          uid:*)   if [ "${state#uid:}" != "$uid" ]; then
                     log "fence: $pod recreated (new uid)"; return 0
                   fi ;;
        esac
      done
      log "ERROR: fence: $pod did not terminate in ${FENCE_TIMEOUT}s (delete already accepted)"
      return 2
    }

    pick_candidate() {   # $1 = ex-primary
      local p
      for p in $(list_pods); do
        [ "$p" = "$1" ] && continue
        if is_standby_ok "$p"; then echo "$p"; return 0; fi
      done
      return 1
    }

    # -----------------------------------------------------------------------
    main() {
      local cm auto primary grace rv candidate
      cm="$(cm_get)" || { log "ERROR: could not read postgresql-role"; return 1; }

      auto="$(json_field "$cm" AUTO_FAILOVER)"
      primary="$(json_field "$cm" PRIMARY_POD)"
      grace="$(json_field "$cm" FAILOVER_GRACE_SECONDS)"; grace="${grace:-120}"
      STS="${primary%-*}"

      if [ "$auto" != "true" ]; then
        log "auto-failover disabled (AUTO_FAILOVER=$auto)"; return 0
      fi
      if [ -z "$primary" ]; then
        log "ERROR: empty PRIMARY_POD in postgresql-role"; return 1
      fi
      log "declared primary: $primary"

      if is_primary_ok "$primary"; then log "primary OK"; return 0; fi

      log "primary not responding; waiting up to ${grace}s before declaring it down"
      local deadline=$(( $(date +%s) + grace ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        sleep 10
        if is_primary_ok "$primary"; then log "primary recovered; no action"; return 0; fi
      done
      log "primary $primary declared DOWN"

      candidate="$(pick_candidate "$primary")" || true
      if [ -z "$candidate" ]; then
        log "ERROR: no healthy replica; failover is not performed"; return 1
      fi
      log "chosen candidate: $candidate"

      # Re-read before mutating: during the grace period the role may have
      # changed or automatic failover may have been disabled (e.g. a manual
      # failover in progress).
      cm="$(cm_get)" || { log "ERROR: could not re-read postgresql-role"; return 1; }
      rv="$(json_field "$cm" resourceVersion)"
      if [ "$(json_field "$cm" AUTO_FAILOVER)" != "true" ] || \
         [ "$(json_field "$cm" PRIMARY_POD)" != "$primary" ]; then
        log "ABORT: state changed during the grace period; nothing is touched"
        return 1
      fi

      # 1) Declare the candidate as primary (optimistic concurrency).
      if ! cm_set_primary "$candidate" "$rv"; then
        log "ERROR: could not update the ConfigMap (did the role change?); aborting"
        return 1
      fi
      # 2) Repoint the Services.
      if ! point_services "$candidate" "$primary"; then
        log "ERROR: could not repoint the Services; reverting everything"
        restore_state "$primary" "$candidate" || \
          log "CRITICAL: the revert did not end up consistent; intervention required"
        return 1
      fi
      # 3) Fencing of the ex-primary.
      fence_pod "$primary"; local frc=$?
      if [ "$frc" -eq 1 ]; then
        log "ERROR: could not isolate $primary (no changes); REVERTING"
        restore_state "$primary" "$candidate" || \
          log "CRITICAL: the revert did not end up consistent; intervention required"
        return 1
      elif [ "$frc" -eq 2 ]; then
        log "CRITICAL: the delete of $primary was accepted but its termination could NOT be confirmed."
        log "CRITICAL: it is NOT reverted automatically (the pod may have been recreated as a replica). Intervention required."
        return 1
      fi
      # 4) Promote the candidate.
      log "promoting $candidate (recreating the pod)"
      delete_pod "$candidate" || log "WARNING: could not delete $candidate (continuing)"

      # 5) Confirm. If it does not promote, it is NOT reverted: the ex-primary
      #    is already isolated and declaring it primary again would be worse.
      local t=0
      while [ "$t" -lt "$PROMOTE_TIMEOUT" ]; do
        sleep 10; t=$((t + 10))
        if is_primary_ok "$candidate"; then
          log "FAILOVER OK: primary=${candidate} (ex-primary ${primary} re-seeds itself)"
          if [ "${candidate##*-}" -ge 2 ]; then
            log "WARNING: the new primary is ${candidate} (ordinal >= 2)."
            log "WARNING: if an HPA owns replicas, scaling down can remove that pod."
            log "WARNING: fail back to postgresql-0 before letting the fleet shrink."
          fi
          return 0
        fi
      done
      log "CRITICAL: $candidate did not promote in ${PROMOTE_TIMEOUT}s."
      log "CRITICAL: the ConfigMap already declares primary=${candidate}. It is NOT reverted. Intervention required."
      return 1
    }

    main
