###############################################################################
# rbac.yaml
#
# Permisos MINIMOS del CronJob de failover automatico. Todo scopeado al
# namespace (Role, no ClusterRole).
###############################################################################

apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-failover
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: pg-ha
    app.kubernetes.io/component: failover

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-failover
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: pg-ha
    app.kubernetes.io/component: failover
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-failover
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: pg-ha
    app.kubernetes.io/component: failover
subjects:
  - kind: ServiceAccount
    name: postgres-failover
roleRef:
  kind: Role
  name: postgres-failover
  apiGroup: rbac.authorization.k8s.io
