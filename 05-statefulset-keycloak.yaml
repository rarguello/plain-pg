###############################################################################
# 05-statefulset-keycloak.yaml
# StatefulSet de PostgreSQL con streaming replication para Keycloak.
#
# CAMBIOS RESPECTO AL STATEFULSET ACTUAL:
#   1. replicas: 2  (antes: 1)
#   2. Se agrega el ConfigMap con el script de HA como entrypoint
#   3. Se agrega el Secret de replicación como env vars
#   4. Se agrega un Headless Service (ya creado en 03-*)
#   5. Se agrega el Service -rw para que Keycloak apunte ahí
#
# IMAGEN:
#   Se usa la imagen de PostgreSQL de RHEL 9 del catálogo de Red Hat.
#   AJUSTAR la versión (15 o 16) según lo que estén usando actualmente.
#   También funciona con la imagen oficial postgres:15 o postgres:16.
#
# NOTA SOBRE LA MIGRACIÓN:
#   Si el StatefulSet actual se llama diferente (ej: "postgresql-keycloak"),
#   hay dos opciones:
#
#   a) Renombrar: eliminar el STS viejo (sin eliminar PVCs), crear el nuevo
#      con el nombre "pg-keycloak" y reasignar el PVC.
#
#   b) Adaptar: cambiar todos los nombres en estos manifiestos para que
#      coincidan con el StatefulSet actual.
#
#   La opción (b) es más segura. Solo hay que reemplazar "pg-keycloak"
#   por el nombre actual en todos los archivos.
###############################################################################

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-keycloak
  namespace: produbanco-databases
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: pg-keycloak
    app.kubernetes.io/part-of: keycloak
    app.kubernetes.io/component: database
spec:
  # -----------------------------------------------------------------------
  # 2 réplicas: pod-0 = primary, pod-1 = réplica
  # Para más redundancia se puede subir a 3 (1 primary + 2 réplicas).
  # -----------------------------------------------------------------------
  replicas: 2

  # Nombre del Headless Service (DEBE coincidir con 03-headless-service.yaml)
  serviceName: pg-keycloak-headless

  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: pg-keycloak

  # -----------------------------------------------------------------------
  # podManagementPolicy: OrderedReady (default)
  # Esto asegura que pod-0 (primary) arranque PRIMERO y esté Ready
  # antes de que pod-1 (réplica) intente arrancar.
  # Crítico para que pg_basebackup funcione.
  # -----------------------------------------------------------------------
  podManagementPolicy: OrderedReady

  # -----------------------------------------------------------------------
  # updateStrategy: OnDelete
  # Para bases de datos, es más seguro controlar los updates manualmente.
  # Con OnDelete, el StatefulSet NO reinicia pods automáticamente al
  # cambiar el template. Debes eliminar cada pod manualmente para que
  # se recree con la nueva configuración.
  # Esto evita que un oc apply accidental reinicie la base de datos.
  # -----------------------------------------------------------------------
  updateStrategy:
    type: OnDelete

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: pg-keycloak
        app.kubernetes.io/part-of: keycloak
        app.kubernetes.io/component: database
    spec:
      # -------------------------------------------------------------------
      # SECURITY CONTEXT
      # OpenShift asigna UIDs arbitrarios por defecto.
      # PostgreSQL necesita que el UID pueda escribir en PGDATA.
      # Con la SCC "restricted-v2" (default en OCP 4.x), esto funciona
      # si la imagen maneja correctamente UIDs arbitrarios.
      #
      # Si hay problemas de permisos, usar la SCC "nonroot-v2":
      #   oc adm policy add-scc-to-user nonroot-v2 \
      #     system:serviceaccount:produbanco-databases:default
      # -------------------------------------------------------------------
      securityContext:
        # fsGroup asegura que el PVC sea escribible por el grupo del contenedor
        fsGroup: 26
        # No correr como root
        runAsNonRoot: true

      # -------------------------------------------------------------------
      # TERMINATION GRACE PERIOD
      # Dar tiempo suficiente a PostgreSQL para hacer shutdown limpio.
      # Un shutdown sucio puede requerir WAL replay al reiniciar.
      # -------------------------------------------------------------------
      terminationGracePeriodSeconds: 120

      containers:
        - name: postgresql
          # ---------------------------------------------------------
          # IMAGEN
          # AJUSTAR a la imagen que están usando actualmente.
          # Opciones:
          #   registry.redhat.io/rhel9/postgresql-15:latest
          #   registry.redhat.io/rhel9/postgresql-16:latest
          #   docker.io/library/postgres:16-bookworm
          # ---------------------------------------------------------
          image: registry.redhat.io/rhel9/postgresql-16:latest

          # ---------------------------------------------------------
          # COMMAND: Usar nuestro script wrapper como entrypoint
          # en vez del entrypoint default de la imagen.
          # ---------------------------------------------------------
          command:
            - /bin/bash
            - /scripts/setup-and-run.sh

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          # ---------------------------------------------------------
          # VARIABLES DE ENTORNO
          # ---------------------------------------------------------
          env:
            # Namespace del pod (necesario para construir el FQDN del primary)
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # Directorio de datos de PostgreSQL
            # Para imagen RHEL 9: /var/lib/pgsql/data/userdata
            # Para imagen oficial Docker: /var/lib/postgresql/data
            - name: PGDATA
              value: "/var/lib/pgsql/data/userdata"

            # Credenciales de replicación (desde Secret)
            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: pg-replication-credentials
                  key: REPLICATION_USER
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-replication-credentials
                  key: REPLICATION_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-replication-credentials
                  key: POSTGRES_PASSWORD

            # Base de datos y usuario de la aplicación (Keycloak)
            - name: APP_DATABASE
              value: "keycloak"
            - name: APP_USER
              value: "keycloak"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-replication-credentials
                  key: POSTGRES_PASSWORD
                  # Idealmente usar un secret separado para el app user.
                  # Aquí se reutiliza por simplicidad.

          # ---------------------------------------------------------
          # RECURSOS
          # Ajustar según la carga real observada.
          # Tip: empezar conservador y subir si hay contención.
          # ---------------------------------------------------------
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
              # No poner CPU limits (best practice K8s)

          # ---------------------------------------------------------
          # PROBES
          # ---------------------------------------------------------
          startupProbe:
            exec:
              command:
                - /bin/bash
                - /scripts/pg-healthcheck.sh
            # Dar hasta 5 minutos para el arranque inicial
            # (pg_basebackup de la réplica puede tomar tiempo)
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - /scripts/pg-healthcheck.sh
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - /scripts/pg-healthcheck.sh
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # ---------------------------------------------------------
          # LIFECYCLE: shutdown limpio
          # ---------------------------------------------------------
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo "[pg-ha] Recibida señal de shutdown. Ejecutando pg_ctl stop..."
                    pg_ctl -D "$PGDATA" -m fast -w stop
                    echo "[pg-ha] PostgreSQL detenido limpiamente."

          # ---------------------------------------------------------
          # VOLUME MOUNTS
          # ---------------------------------------------------------
          volumeMounts:
            # Datos de PostgreSQL (PVC persistente)
            - name: pgdata
              mountPath: /var/lib/pgsql/data
            # Scripts de HA (ConfigMap, read-only)
            - name: scripts
              mountPath: /scripts

      # -------------------------------------------------------------------
      # VOLUMES
      # -------------------------------------------------------------------
      volumes:
        # Scripts de HA desde ConfigMap
        - name: scripts
          configMap:
            name: pg-ha-scripts
            defaultMode: 0755

      # -------------------------------------------------------------------
      # AFINIDAD: No poner los dos pods en el mismo nodo
      # -------------------------------------------------------------------
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgresql
                    app.kubernetes.io/instance: pg-keycloak
                topologyKey: kubernetes.io/hostname

  # -----------------------------------------------------------------------
  # VOLUME CLAIM TEMPLATES
  # Cada pod del StatefulSet recibe su propio PVC:
  #   pgdata-pg-keycloak-0  →  PVC del primary
  #   pgdata-pg-keycloak-1  →  PVC de la réplica
  #
  # NOTA SOBRE MIGRACIÓN:
  # Si el StatefulSet actual ya tiene un PVC llamado diferente,
  # hay que ajustar el nombre aquí o renombrar el PVC existente.
  # -----------------------------------------------------------------------
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: pg-keycloak
      spec:
        accessModes:
          - ReadWriteOnce
        # AJUSTAR al StorageClass real del cluster
        storageClassName: ocs-storagecluster-ceph-rbd
        resources:
          requests:
            storage: 20Gi
